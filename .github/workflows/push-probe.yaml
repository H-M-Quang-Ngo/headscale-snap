name: push probe (throwaway)

on: workflow_dispatch

permissions: {}

jobs:
  probe:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Probe pushes (case E - fast-forward across a MODIFIED workflow file)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Fixed commits on the fork's main: a5ae5fd modifies .github/workflows/release-instructions.yaml
          # and its parent is 7b2099b (Python-only change).
          BEFORE=$(git rev-parse 7b2099b)
          AFTER=$(git rev-parse a5ae5fd)
          git diff --name-status "$BEFORE" "$AFTER"
          try() {
            if out=$(git push "$remote" "$2" 2>&1); then
              echo "RESULT $1: PASS"
            else
              echo "RESULT $1: FAIL"
              echo "$out" | grep -E "refusing|rejected|error" || echo "$out"
            fi
          }
          try "E1 new branch at 7b2099b" "$BEFORE:refs/heads/push-probe-e"
          try "E2 fast-forward 7b2099b -> a5ae5fd (M workflow)" "$AFTER:refs/heads/push-probe-e"
          try "E3 new tag at 7b2099b" "$BEFORE:refs/tags/push-probe-e"
          # Cleanup; ignore errors
          for ref in refs/heads/push-probe-e refs/tags/push-probe-e; do
            git push "$remote" ":$ref" > /dev/null 2>&1 || true
          done
